name: Jandosoft Scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: scheduler
  cancel-in-progress: false

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run scheduler
        run: |
          BASE_URL="${{ secrets.BASE_URL || 'https://jandosoft.vercel.app' }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"

          echo "[$(date -u)] Starting scheduler..."

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL}/api/scheduler/run")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "HTTP Status: ${HTTP_CODE}"
          echo "${BODY}" | python3 -m json.tool 2>/dev/null || echo "${BODY}"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "Scheduler failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

          PROCESSED=$(echo "${BODY}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('processed',0))" 2>/dev/null || echo "0")
          FAILED=$(echo "${BODY}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('failed',0))" 2>/dev/null || echo "0")
          DURATION=$(echo "${BODY}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('durationMs',0))" 2>/dev/null || echo "0")

          echo "[$(date -u)] Done: ${PROCESSED} processed, ${FAILED} failed, ${DURATION}ms"
